name: windows-build

# Builds the Windows .exe on a real Windows runner — the app is cross-platform
# Rust, but cross-compiling wgpu + ort from macOS is a guessing game.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you rebuild from the Actions tab without a push

permissions:
  contents: write # needed to upload the release asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup ships preinstalled on windows-latest, so there's no toolchain step.
      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Fetch CLAP model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/models -Force
          Invoke-WebRequest -Uri "https://huggingface.co/icybawss/clap-htsat-unfused-audio-encoder-onnx/resolve/main/audio_model.onnx" -OutFile native/models/audio_model.onnx

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/models -Force
          Copy-Item native/target/release/pulsemap.exe dist/
          # ONNX Runtime is statically linked into pulsemap.exe. DirectML is the
          # one runtime dependency that has to ship as a DLL alongside it.
          Copy-Item native/target/release/*.dll dist/
          Copy-Item native/models/audio_model.onnx dist/models/
          Copy-Item native/models/model.json dist/models/
          Copy-Item native/models/mel_slaney.npy dist/models/
          Copy-Item README-windows.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pulsemap-windows
          path: dist/

      - name: Zip for release
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath pulsemap-windows.zip

      - name: Publish to v1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: pulsemap-windows.zip
